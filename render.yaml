# Render "Blueprint" — a TEMPLATE, nothing is deployed until you connect this repo in your own Render account.
# Cost: the free plan below is $0 but sleeps after ~15 min idle (first load then takes ~30-60 s).
# Open the site a few minutes before the event, or pick a paid always-on plan.
# IMPORTANT: keep a single instance — rooms live in memory, so scaling to 2+ instances would split rooms.
services:
  - type: web
    name: typedrive-gantec-connect
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the admin login: set both in the Render dashboard (never in this file)
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
